# Core Kernel Tuning
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_MAIN_STACK_SIZE=2048

# Hardware Drivers
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

# FRDM-STBC-AGM01 Shield Drivers
CONFIG_SENSOR=y
CONFIG_FXOS8700=y
CONFIG_FXAS21002=y

# Top-level master switch for altitude features (Set to y if using Baro)
CONFIG_FLIGHT_CTL_HAS_BARO=n

# Defer logging tasks to background queues to protect the 400Hz path
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# CMSIS-DSP Acceleration
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_CONTROLLER=y
CONFIG_CMSIS_DSP_FASTMATH=y

# Enable Interactive Shell Subsystem
CONFIG_SHELL=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y

